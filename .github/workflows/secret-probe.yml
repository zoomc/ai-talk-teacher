name: Secret Probe (temporary diagnostic)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe demo auth secrets
        env:
          DEMO_BASIC_AUTH_USER: ${{ secrets.DEMO_BASIC_AUTH_USER }}
          DEMO_BASIC_AUTH_PASSWORD: ${{ secrets.DEMO_BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          user_hash="$(printf '%s' "$DEMO_BASIC_AUTH_USER" | openssl passwd -apr1 -salt wAJ/H6TD -stdin)"
          pass_hash="$(printf '%s' "$DEMO_BASIC_AUTH_PASSWORD" | openssl passwd -apr1 -salt wAJ/H6TD -stdin)"
          stored='$apr1$wAJ/H6TD$DXndJQ4rjMmLT219N4nvB1'
          echo "user_hash=${user_hash}"
          echo "pass_hash=${pass_hash}"
          echo "user_len=${#DEMO_BASIC_AUTH_USER}"
          echo "pass_len=${#DEMO_BASIC_AUTH_PASSWORD}"
          if [ "$pass_hash" = "$stored" ]; then
            echo "VERDICT: password matches the deployed htpasswd"
          else
            echo "VERDICT: password DIFFERS from deployed htpasswd"
          fi
          if [ "${#DEMO_BASIC_AUTH_PASSWORD}" = "9" ]; then
            echo "pass_len_hint: 9 chars (demo12300)"
          fi
