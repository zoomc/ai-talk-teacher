name: Secret Probe (temporary diagnostic)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe local secret hashes
        env:
          DEMO_BASIC_AUTH_USER: ${{ secrets.DEMO_BASIC_AUTH_USER }}
          DEMO_BASIC_AUTH_PASSWORD: ${{ secrets.DEMO_BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          echo "local_user_hex=$(printf '%s' "$DEMO_BASIC_AUTH_USER" | xxd -p)"
          echo "local_pass_hex=$(printf '%s' "$DEMO_BASIC_AUTH_PASSWORD" | xxd -p)"
          echo "local_user_len=${#DEMO_BASIC_AUTH_USER}"
          echo "local_pass_len=${#DEMO_BASIC_AUTH_PASSWORD}"

      - name: Probe remote envs via ssh-action (same pinned SHA)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEMO_BASIC_AUTH_USER: ${{ secrets.DEMO_BASIC_AUTH_USER }}
          DEMO_BASIC_AUTH_PASSWORD: ${{ secrets.DEMO_BASIC_AUTH_PASSWORD }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_SSH_PORT || 22 }}
          envs: DEMO_BASIC_AUTH_USER,DEMO_BASIC_AUTH_PASSWORD
          script: |
            set -euo pipefail
            echo "remote_user_hex=$(printf '%s' "$DEMO_BASIC_AUTH_USER" | xxd -p)"
            echo "remote_pass_hex=$(printf '%s' "$DEMO_BASIC_AUTH_PASSWORD" | xxd -p)"
            echo "remote_user_len=${#DEMO_BASIC_AUTH_USER}"
            echo "remote_pass_len=${#DEMO_BASIC_AUTH_PASSWORD}"
            echo "remote_openssl_hash=$(printf '%s' "$DEMO_BASIC_AUTH_PASSWORD" | openssl passwd -apr1 -salt v2bdWoan -stdin)"
