name: Deploy Aliyun production and Demo Web

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to deploy
        required: true
        default: main
        type: string
  push:
    branches: [main]

concurrency:
  group: ai-talk-teacher-web
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROD_BASE_HREF: /talk/
  DEMO_BASE_HREF: /talk-demo/
  PROD_URL: https://zoomlab.top/talk
  DEMO_URL: https://zoomlab.top/talk-demo
  PROD_TARGET: /opt/ai-talk-teacher
  DEMO_TARGET: /opt/ai-talk-teacher-demo
  RELEASE_ROOT: /opt/ai-talk-teacher-releases
  DEMO_AUTH_FILE: /etc/nginx/.htpasswd.ai-talk-teacher-demo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build production Web
        run: |
          flutter build web --release --no-wasm-dry-run --pwa-strategy=offline-first \
            --no-web-resources-cdn \
            --dart-define=APP_MODE=production \
            --dart-define=APP_BASE_PATH="$PROD_BASE_HREF" \
            --base-href="$PROD_BASE_HREF"
          bash scripts/stamp_web_release.sh build/web "$RELEASE_SHA" production
          bash scripts/verify_web_artifact.sh build/web "$PROD_BASE_HREF" production "$RELEASE_SHA"

      - name: Package production Web
        run: |
          mkdir -p release-payload/prod
          cp -a build/web/. release-payload/prod/

      - name: Build Demo Web
        run: |
          flutter build web --release --no-wasm-dry-run --pwa-strategy=offline-first \
            --no-web-resources-cdn \
            --dart-define=APP_MODE=demo \
            --dart-define=APP_BASE_PATH="$DEMO_BASE_HREF" \
            --base-href="$DEMO_BASE_HREF"
          bash scripts/stamp_web_release.sh build/web "$RELEASE_SHA" demo
          bash scripts/verify_web_artifact.sh build/web "$DEMO_BASE_HREF" demo "$RELEASE_SHA"

      - name: Package Demo Web
        run: |
          set -euo pipefail
          mkdir -p release-payload/demo
          cp -a build/web/. release-payload/demo/
          test -s release-payload/prod/index.html
          test -s release-payload/demo/index.html
          printf '%s\n' "$RELEASE_SHA" > release-sha.txt
          tar -czf ai-talk-teacher-web.tgz release-payload release-sha.txt

      - name: Upload production and Demo Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-talk-teacher-web
          path: ai-talk-teacher-web.tgz
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: aliyun-production
    steps:
      - name: Download production and Demo Web artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-talk-teacher-web

      - name: Resolve release SHA
        id: resolve_release
        run: |
          set -euo pipefail
          tar -xzf ai-talk-teacher-web.tgz release-sha.txt
          test -s release-sha.txt
          release_sha="$(tr -d '\r\n' < release-sha.txt)"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Copy production and Demo Web to Aliyun
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_SSH_PORT || 22 }}
          source: ai-talk-teacher-web.tgz
          target: /tmp

      - name: Atomically activate production and Demo Web
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ steps.resolve_release.outputs.release_sha }}
          PROD_TARGET: ${{ env.PROD_TARGET }}
          DEMO_TARGET: ${{ env.DEMO_TARGET }}
          RELEASE_ROOT: ${{ env.RELEASE_ROOT }}
          DEMO_AUTH_FILE: ${{ env.DEMO_AUTH_FILE }}
          DEMO_BASIC_AUTH_USER: ${{ secrets.DEMO_BASIC_AUTH_USER }}
          DEMO_BASIC_AUTH_PASSWORD: ${{ secrets.DEMO_BASIC_AUTH_PASSWORD }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_SSH_PORT || 22 }}
          envs: RELEASE_SHA,PROD_TARGET,DEMO_TARGET,RELEASE_ROOT,DEMO_AUTH_FILE,DEMO_BASIC_AUTH_USER,DEMO_BASIC_AUTH_PASSWORD
          script: |
            set -euo pipefail
            : "${RELEASE_SHA:?release SHA is required}"
            : "${PROD_TARGET:?production target is required}"
            : "${DEMO_TARGET:?demo target is required}"
            : "${RELEASE_ROOT:?release root is required}"
            : "${DEMO_AUTH_FILE:?demo auth file is required}"
            : "${DEMO_BASIC_AUTH_USER:?demo auth username is required}"
            : "${DEMO_BASIC_AUTH_PASSWORD:?demo auth password is required}"
            case "$DEMO_BASIC_AUTH_USER" in
              *:*)
                echo 'Demo auth username must not contain a colon' >&2
                exit 1
                ;;
            esac
            auth_tmp="$(mktemp /tmp/speakflow-demo-auth.XXXXXX)"
            trap 'rm -f "$auth_tmp"' EXIT
            auth_hash="$(printf '%s' "$DEMO_BASIC_AUTH_PASSWORD" | openssl passwd -apr1 -stdin)"
            test -n "$auth_hash"
            printf '%s:%s\n' "$DEMO_BASIC_AUTH_USER" "$auth_hash" > "$auth_tmp"
            sudo -n install -o root -g nginx -m 640 "$auth_tmp" "${DEMO_AUTH_FILE}.next"
            sudo -n mv -Tf "${DEMO_AUTH_FILE}.next" "$DEMO_AUTH_FILE"
            archive="/tmp/ai-talk-teacher-web.tgz"
            test -s "$archive"
            sudo -n install -d -o admin -g admin -m 755 "$RELEASE_ROOT"
            release_dir="$RELEASE_ROOT/$RELEASE_SHA"
            rm -rf "$release_dir"
            mkdir -p "$release_dir"
            tar -xzf "$archive" -C "$release_dir"
            prod_root="$release_dir/release-payload/prod"
            demo_root="$release_dir/release-payload/demo"
            test -s "$prod_root/index.html"
            test -s "$demo_root/index.html"

            backup_prod="$RELEASE_ROOT/previous-production-$RELEASE_SHA"
            backup_demo="$RELEASE_ROOT/previous-demo-$RELEASE_SHA"
            sudo -n rm -rf "$backup_prod" "$backup_demo"
            if [ -e "$PROD_TARGET" ] || [ -L "$PROD_TARGET" ]; then
              sudo -n mv -Tf "$PROD_TARGET" "$backup_prod"
            fi
            if [ -e "$DEMO_TARGET" ] || [ -L "$DEMO_TARGET" ]; then
              sudo -n mv -Tf "$DEMO_TARGET" "$backup_demo"
            fi
            sudo -n ln -s "$prod_root" "${PROD_TARGET}.next"
            sudo -n mv -Tf "${PROD_TARGET}.next" "$PROD_TARGET"
            sudo -n ln -s "$demo_root" "${DEMO_TARGET}.next"
            sudo -n mv -Tf "${DEMO_TARGET}.next" "$DEMO_TARGET"
            sudo -n nginx -t
            sudo -n systemctl reload nginx
            sudo -n rm -rf "$RELEASE_ROOT/previous-production" "$RELEASE_ROOT/previous-demo"
            if [ -e "$backup_prod" ] || [ -L "$backup_prod" ]; then
              sudo -n ln -s "$backup_prod" "$RELEASE_ROOT/previous-production"
            fi
            if [ -e "$backup_demo" ] || [ -L "$backup_demo" ]; then
              sudo -n ln -s "$backup_demo" "$RELEASE_ROOT/previous-demo"
            fi

      - name: Verify production and Demo Web health
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ steps.resolve_release.outputs.release_sha }}
          PROD_URL: ${{ env.PROD_URL }}
          DEMO_URL: ${{ env.DEMO_URL }}
          DEMO_BASIC_AUTH_USER: ${{ secrets.DEMO_BASIC_AUTH_USER }}
          DEMO_BASIC_AUTH_PASSWORD: ${{ secrets.DEMO_BASIC_AUTH_PASSWORD }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_SSH_PORT || 22 }}
          envs: RELEASE_SHA,PROD_URL,DEMO_URL,DEMO_BASIC_AUTH_USER,DEMO_BASIC_AUTH_PASSWORD
          script: |
            set -euo pipefail
            curl -fsS "$PROD_URL/" | grep -q 'flutter_bootstrap.js'
            curl -fsS "$PROD_URL/version.json" | grep -q "$RELEASE_SHA"
            curl -fsS "$PROD_URL/#/health-check" | grep -q 'flutter_bootstrap.js'
            test "$(curl -sS -o /dev/null -w '%{http_code}' "$DEMO_URL/")" = 401
            curl -fsS -u "${DEMO_BASIC_AUTH_USER:?}:${DEMO_BASIC_AUTH_PASSWORD:?}" "$DEMO_URL/" | grep -q 'flutter_bootstrap.js'
            curl -fsS -u "${DEMO_BASIC_AUTH_USER:?}:${DEMO_BASIC_AUTH_PASSWORD:?}" "$DEMO_URL/version.json" | grep -q "$RELEASE_SHA"
            curl -fsSI -u "${DEMO_BASIC_AUTH_USER:?}:${DEMO_BASIC_AUTH_PASSWORD:?}" "$DEMO_URL/" | grep -qi 'X-Robots-Tag:.*noindex'

      - name: Roll back production and Demo Web after deployment failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ steps.resolve_release.outputs.release_sha }}
          PROD_TARGET: ${{ env.PROD_TARGET }}
          DEMO_TARGET: ${{ env.DEMO_TARGET }}
          RELEASE_ROOT: ${{ env.RELEASE_ROOT }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_SSH_PORT || 22 }}
          envs: RELEASE_SHA,PROD_TARGET,DEMO_TARGET,RELEASE_ROOT
          script: |
            set -euo pipefail
            : "${RELEASE_SHA:?release SHA is required}"
            restore_target() {
              local target="$1"
              local backup="$2"
              if [ -e "$backup" ] || [ -L "$backup" ]; then
                if [ -e "$target" ] || [ -L "$target" ]; then
                  sudo -n mv -Tf "$target" "$RELEASE_ROOT/failed-$(basename "$target")"
                fi
                sudo -n mv -Tf "$backup" "$target"
              elif [ -e "$target" ] || [ -L "$target" ]; then
                sudo -n rm -rf "$target"
              fi
            }
            restore_target "$PROD_TARGET" "$RELEASE_ROOT/previous-production-$RELEASE_SHA"
            restore_target "$DEMO_TARGET" "$RELEASE_ROOT/previous-demo-$RELEASE_SHA"
            sudo -n nginx -t
            sudo -n systemctl reload nginx
