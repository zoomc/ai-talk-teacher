name: Deploy Aliyun production Web

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to deploy
        required: true
        default: main
        type: string
  push:
    branches: [main]

concurrency:
  group: ai-talk-teacher-production-web
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROD_BASE_HREF: /talk/
  PROD_URL: https://zoomlab.top/talk
  PROD_TARGET: /opt/ai-talk-teacher
  RELEASE_ROOT: /home/admin/ai-talk-teacher-releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build production Web
        run: |
          flutter build web --release --no-wasm-dry-run --pwa-strategy=offline-first \
            --no-web-resources-cdn \
            --dart-define=APP_MODE=production \
            --dart-define=APP_BASE_PATH="$PROD_BASE_HREF" \
            --base-href="$PROD_BASE_HREF"
          bash scripts/stamp_web_release.sh build/web "$RELEASE_SHA" production
          bash scripts/verify_web_artifact.sh build/web "$PROD_BASE_HREF" production "$RELEASE_SHA"

      - name: Package production Web
        run: |
          set -euo pipefail
          mkdir -p release-payload/web
          cp -a build/web/. release-payload/web/
          printf '%s\n' "$RELEASE_SHA" > release-sha.txt
          tar -czf ai-talk-teacher-web.tgz release-payload release-sha.txt

      - name: Upload production Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-talk-teacher-web
          path: ai-talk-teacher-web.tgz
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: aliyun-production
    steps:
      - name: Download production Web artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-talk-teacher-web

      - name: Resolve release SHA
        id: resolve_release
        run: |
          set -euo pipefail
          tar -xzf ai-talk-teacher-web.tgz release-sha.txt
          test -s release-sha.txt
          release_sha="$(tr -d '\r\n' < release-sha.txt)"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Copy production Web to Aliyun
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_SSH_PORT || 22 }}
          source: ai-talk-teacher-web.tgz
          target: /tmp

      - name: Atomically activate production Web
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ steps.resolve_release.outputs.release_sha }}
          PROD_TARGET: ${{ env.PROD_TARGET }}
          RELEASE_ROOT: ${{ env.RELEASE_ROOT }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_SSH_PORT || 22 }}
          envs: RELEASE_SHA,PROD_TARGET,RELEASE_ROOT
          script_stop: true
          script: |
            set -euo pipefail
            : "${RELEASE_SHA:?release SHA is required}"
            : "${PROD_TARGET:?production target is required}"
            : "${RELEASE_ROOT:?release root is required}"
            archive="/tmp/ai-talk-teacher-web.tgz"
            test -s "$archive"
            mkdir -p "$RELEASE_ROOT"
            release_dir="$RELEASE_ROOT/$RELEASE_SHA"
            rm -rf "$release_dir"
            mkdir -p "$release_dir"
            tar -xzf "$archive" -C "$release_dir"
            web_root="$release_dir/release-payload/web"
            test -s "$web_root/index.html"

            previous_target="$RELEASE_ROOT/previous-production"
            if [ -e "$PROD_TARGET" ] || [ -L "$PROD_TARGET" ]; then
              mv -Tf "$PROD_TARGET" "${previous_target}.next"
              mv -Tf "${previous_target}.next" "$previous_target"
            fi
            ln -s "$web_root" "${PROD_TARGET}.next"
            mv -Tf "${PROD_TARGET}.next" "$PROD_TARGET"
            sudo -n nginx -t
            sudo -n systemctl reload nginx

      - name: Verify production Web health
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ steps.resolve_release.outputs.release_sha }}
          PROD_URL: ${{ env.PROD_URL }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_SSH_PORT || 22 }}
          envs: RELEASE_SHA,PROD_URL
          script_stop: true
          script: |
            set -euo pipefail
            curl -fsS "$PROD_URL/" | grep -q 'flutter_bootstrap.js'
            curl -fsS "$PROD_URL/version.json" | grep -q "$RELEASE_SHA"
            curl -fsS "$PROD_URL/#/health-check" | grep -q 'flutter_bootstrap.js'

      - name: Roll back production Web after deployment failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_TARGET: ${{ env.PROD_TARGET }}
          RELEASE_ROOT: ${{ env.RELEASE_ROOT }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_SSH_PORT || 22 }}
          envs: PROD_TARGET,RELEASE_ROOT
          script_stop: true
          script: |
            set -euo pipefail
            previous_target="$RELEASE_ROOT/previous-production"
            if [ -e "$previous_target" ] || [ -L "$previous_target" ]; then
              if [ -e "$PROD_TARGET" ] || [ -L "$PROD_TARGET" ]; then
                mv -Tf "$PROD_TARGET" "$RELEASE_ROOT/failed-production"
              fi
              mv -Tf "$previous_target" "$PROD_TARGET"
              sudo -n nginx -t
              sudo -n systemctl reload nginx
            fi
