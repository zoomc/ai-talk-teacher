name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Check formatting for newly added Dart files
        run: |
          set -euo pipefail
          new_dart="$(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$GITHUB_SHA" -- '*.dart' | tr '\n' ' ')"
          if [ -n "${new_dart// }" ]; then
            # The repository predates this CI gate and contains legacy files
            # that are intentionally not reflowed in feature commits.
            dart format --output=none --set-exit-if-changed $new_dart
          fi

      - name: Scan tracked source for secrets
        run: |
          set -euo pipefail
          if git grep -nE \
            '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|Authorization: Bearer [A-Za-z0-9._-]{20,})' .; then
            echo 'Potential credential material found in tracked source.' >&2
            exit 1
          fi

      - name: Verify dependency and asset license evidence
        run: bash scripts/verify_dependency_licenses.sh

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test

      - name: Build production web
        run: |
          flutter build web --release --no-wasm-dry-run --pwa-strategy=offline-first \
            --no-web-resources-cdn \
            --dart-define=APP_MODE=production \
            --dart-define=APP_BASE_PATH=/talk/ \
            --base-href=/talk/
          bash scripts/stamp_web_release.sh build/web "$GITHUB_SHA" production
          bash scripts/verify_web_artifact.sh build/web /talk/ production "$GITHUB_SHA"

      - name: Build Demo web
        run: |
          flutter build web --release --no-wasm-dry-run --pwa-strategy=offline-first \
            --no-web-resources-cdn \
            --dart-define=APP_MODE=demo \
            --dart-define=APP_BASE_PATH=/talk-demo/ \
            --base-href=/talk-demo/
          bash scripts/stamp_web_release.sh build/web "$GITHUB_SHA" demo
          bash scripts/verify_web_artifact.sh build/web /talk-demo/ demo "$GITHUB_SHA"

  playwright-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install E2E dependencies
        run: npm ci

      - name: Typecheck Playwright suite
        run: npm run typecheck

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build E2E simulation web
        run: |
          set -o pipefail
          flutter build web --release --no-wasm-dry-run --no-web-resources-cdn \
            --dart-define=APP_MODE=e2e \
            --dart-define=E2E=true 2>&1 | tee e2e-build.log

      - name: Stamp E2E artifact
        run: bash scripts/stamp_web_release.sh build/web "$GITHUB_SHA" e2e

      - name: Verify E2E artifact
        run: bash scripts/verify_web_artifact.sh build/web / e2e "$GITHUB_SHA"

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Simulation smoke test
        working-directory: e2e
        run: npm run test:simulation:responsive

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-playwright-${{ github.sha }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
