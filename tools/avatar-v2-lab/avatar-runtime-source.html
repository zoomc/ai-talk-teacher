<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SpeakFlow Avatar V2</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;}
  #c{width:100%;height:100%;display:block;touch-action:none;}
  body::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 28%,rgba(255,255,255,.98) 0%,rgba(239,241,250,.94) 48%,rgba(218,222,238,.72) 100%);pointer-events:none;}
  canvas{position:relative;z-index:1;display:block;width:100%;height:100%;}
  #s{position:absolute;z-index:2;top:10px;left:12px;font:11px/1.4 -apple-system,system-ui,sans-serif;color:rgba(90,95,118,.65);pointer-events:none;letter-spacing:.02em;}
</style>
</head>
<body>
<div id="s">Loading Avatar V2…</div>
<script>
  window.addEventListener('error', (event) => {
    const message = event?.error?.message || event?.message || 'runtime error';
    document.getElementById('s').textContent = `Avatar runtime error: ${message}`;
  });
  window.addEventListener('unhandledrejection', (event) => {
    document.getElementById('s').textContent = `Avatar runtime error: ${event.reason || 'module failed'}`;
  });
</script>
<script type="importmap">
{"imports":{
  "three":"./vendor/three/build/three.module.js",
  "three/addons/":"./vendor/three/examples/jsm/",
  "talkinghead":"./vendor/talkinghead/talkinghead.mjs"
}}
</script>
<script type="module">
import {TalkingHead} from 'talkinghead';

// Avatar V2 runtime boundary:
// Flutter sends phase, emotion, viseme, audio level and gesture intent.
// The browser runtime owns models, morph targets, eye contact, animation
// blending, idle motion and gesture timelines. No Dart-side bone control.
const statusEl = document.getElementById('s');
const root = document.body;
const head = new TalkingHead(root, {
  cameraView:'upper',
  cameraDistance:0.05,
  cameraRotateEnable:false,
  cameraZoomEnable:false,
  modelPixelRatio:Math.min(window.devicePixelRatio, 1.75),
  modelFPS:60,
  avatarMood:'neutral',
  avatarIdleEyeContact:0.38,
  avatarSpeakingEyeContact:0.72,
  avatarListeningEyeContact:0.82,
  avatarSpeakingHeadMove:0.32,
  lightAmbientColor:0xeef3ff,
  lightAmbientIntensity:1.3,
  lightDirectColor:0xfff7ed,
  lightDirectIntensity:17,
  lightDirectPhi:0.9,
  lightDirectTheta:2.1,
  lightSpotColor:0x94b8ff,
  lightSpotIntensity:7,
  lightSpotPhi:0.9,
  lightSpotTheta:3.4,
  lightSpotDispersion:1.8,
  // TTS audio is played by Flutter. The bridge receives the real playback
  // clock's amplitude and viseme timeline; TalkingHead remains the renderer.
  lipsyncModules:[],
});

const AVATAR_URL = './avatar-v2/mpfb.glb';
const current = {state:'idle', emotion:'neutral', gesture:'idle', viseme:'closed', audio:0};
let ready = false;
let disposed = false;
let pending = [];
let lastGestureAt = 0;
let gestureTimers = [];

const emotionMood = {
  neutral:'neutral', warm:'love', happy:'happy', encouraging:'happy',
  curious:'neutral', thinking:'neutral', surprised:'fear', serious:'neutral',
};
const visemeKeys = [
  'viseme_sil','viseme_PP','viseme_FF','viseme_TH','viseme_DD','viseme_kk',
  'viseme_CH','viseme_SS','viseme_nn','viseme_RR','viseme_aa','viseme_E',
  'viseme_I','viseme_O','viseme_U',
];
const visemeMap = {
  closed:['viseme_sil'], slightOpen:['viseme_DD'], smallOpen:['viseme_E'],
  mediumOpen:['viseme_aa'], wideOpen:['viseme_aa'], roundedSmall:['viseme_O'],
  roundedLarge:['viseme_O'], wide:['viseme_I'], flat:['viseme_E'],
  smile:['viseme_I'], smileOpen:['viseme_I'], frown:['viseme_E'],
  pucker:['viseme_U'], teeth:['viseme_DD'], tongueUp:['viseme_aa'],
  tongueOut:['viseme_aa'], biteLip:['viseme_PP'], openTeeth:['viseme_aa'],
  oval:['viseme_O'], wideFlat:['viseme_I'],
};

function setMorph(name, value) {
  const target = head.mtAvatar && head.mtAvatar[name];
  if (!target) return;
  target.newvalue = Math.max(0, Math.min(1, Number(value) || 0));
  target.needsUpdate = true;
}

function clearMorphs(keys) { keys.forEach((key) => setMorph(key, 0)); }

function applyViseme(name) {
  current.viseme = String(name || 'closed');
  clearMorphs(visemeKeys);
  const keys = visemeMap[current.viseme] || visemeMap.closed;
  const weight = current.viseme === 'wideOpen' || current.viseme === 'mediumOpen' ? 0.78 : 0.62;
  keys.forEach((key) => setMorph(key, weight));
}

function applyEmotion(name) {
  current.emotion = String(name || 'neutral').toLowerCase();
  head.setMood(emotionMood[current.emotion] || 'neutral');
  clearMorphs(['browInnerUp','browDownLeft','browDownRight','eyeWideLeft','eyeWideRight','eyeSquintLeft','eyeSquintRight','mouthSmileLeft','mouthSmileRight','mouthPressLeft','mouthPressRight']);
  switch (current.emotion) {
    case 'curious':
      setMorph('browInnerUp', 0.24); break;
    case 'thinking':
      setMorph('browInnerUp', 0.18); setMorph('mouthPressLeft', 0.18); setMorph('mouthPressRight', 0.18); break;
    case 'surprised':
      setMorph('eyeWideLeft', 0.3); setMorph('eyeWideRight', 0.3); setMorph('browInnerUp', 0.28); break;
    case 'serious':
      setMorph('browDownLeft', 0.18); setMorph('browDownRight', 0.18); break;
    case 'warm':
    case 'happy':
    case 'encouraging':
      setMorph('mouthSmileLeft', 0.26); setMorph('mouthSmileRight', 0.26); break;
    default: break;
  }
}

function applyAudioLevel(level) {
  current.audio = Math.max(0, Math.min(1, Number(level) || 0));
  // The real TTS playback amplitude is the fallback clock when a phoneme
  // timeline is unavailable. It is layered on top of the current viseme.
  setMorph('mouthOpen', current.audio * 0.72);
  setMorph('jawOpen', current.audio * 0.68);
}

function clearGestureTimers() {
  gestureTimers.forEach((timer) => clearTimeout(timer));
  gestureTimers = [];
}

function stopGesture() {
  clearGestureTimers();
  head.stopGesture(550);
}

function cue(delay, callback) {
  gestureTimers.push(setTimeout(callback, delay));
}

function runGesture(name) {
  const now = performance.now();
  if (now - lastGestureAt < 650) return;
  lastGestureAt = now;
  stopGesture();
  const gesture = String(name || 'idle').toLowerCase();
  // TalkingHead owns the retargeted animation and crossfade. These cues are
  // semantic; no caller can reach a bone or morph index.
  switch (gesture) {
    case 'small_nod':
    case 'nod':
    case 'gentle_nod':
      cue(120, () => head.lookAtCamera(500));
      cue(720, () => head.lookAt(0.5, 0.47, 420));
      break;
    case 'large_nod':
      cue(100, () => head.lookAtCamera(850));
      cue(1050, () => head.lookAt(0.5, 0.4, 650));
      break;
    case 'shake_head':
      cue(80, () => head.lookAt(0.38, 0.5, 450));
      cue(580, () => head.lookAt(0.62, 0.5, 650));
      cue(1320, () => head.lookAtCamera(520));
      break;
    case 'open_palm':
    case 'open_hand':
    case 'greeting':
      cue(180, () => head.playGesture('handup', 1.7, false, 650));
      break;
    case 'praise':
      cue(160, () => head.playGesture('thumbup', 1.5, false, 650));
      cue(1550, () => head.lookAtCamera(700));
      break;
    case 'thinking':
    case 'thinkpose':
    case 'thinkPose':
    case 'confused':
      applyEmotion('thinking');
      cue(160, () => head.playGesture('shrug', 1.7, false, 700));
      cue(850, () => head.lookAt(0.34, 0.58, 820));
      break;
    case 'explain':
    default:
      cue(180, () => head.playGesture('side', 1.5, false, 650));
      cue(1550, () => head.playGesture('handup', 1.1, true, 650));
      break;
  }
}

function applyState(name) {
  current.state = String(name || 'idle').toLowerCase();
  switch (current.state) {
    case 'listening':
    case 'recording':
      head.makeEyeContact(1400); runGesture('small_nod'); break;
    case 'thinking':
    case 'generating':
    case 'transcribing':
      head.lookAt(0.34, 0.58, 900); runGesture('thinking'); break;
    case 'speaking':
    case 'synthesizing':
      head.makeEyeContact(1200); break;
    default:
      stopGesture(); applyViseme('closed'); break;
  }
}

function handleCommand(data) {
  if (!data || typeof data !== 'object') return;
  switch (data.type) {
    case 'avatar:setState': applyState(data.state); break;
    case 'avatar:setEmotion': applyEmotion(data.emotion); break;
    case 'avatar:setViseme': applyViseme(data.viseme); break;
    case 'avatar:setAudioLevel': applyAudioLevel(data.level); break;
    case 'avatar:gesture': runGesture(data.gesture); break;
    case 'avatar:interrupt': stopGesture(); applyViseme('closed'); applyAudioLevel(0); applyState('idle'); break;
    case 'avatar:lookAt': head.lookAtCamera(Number(data.duration) || 800); break;
  }
}

function send(type, payload = {}) {
  window.parent.postMessage({type, ...payload}, window.location.origin);
}

window.addEventListener('message', (event) => {
  if (event.origin !== window.location.origin || event.source !== window.parent) return;
  const data = event.data;
  if (!data || typeof data.type !== 'string' || !data.type.startsWith('avatar:')) return;
  if (!ready) pending.push(data); else handleCommand(data);
});

async function boot() {
  try {
    await head.showAvatar({url:AVATAR_URL, body:'F', avatarMood:'neutral', baseline:{headRotateX:-0.025, eyeBlinkLeft:0.15, eyeBlinkRight:0.15}});
    ready = true;
    statusEl.textContent = '';
    send('avatar:ready');
    pending.splice(0).forEach(handleCommand);
    applyState(current.state);
    applyEmotion(current.emotion);
    applyViseme(current.viseme);
  } catch (error) {
    console.error(error);
    statusEl.textContent = 'Avatar unavailable';
    send('avatar:error', {error:'model-load'});
  }
}

window.speakflowAvatar = {
  isReady: () => ready,
  dispose: () => { disposed = true; stopGesture(); head.stop(); },
};

// Keep the audio fallback smooth even when the Dart stream is sparse.
setInterval(() => { if (!disposed && current.audio > 0.01) applyAudioLevel(current.audio * 0.86); }, 70);
boot();
</script>
</body>
</html>
