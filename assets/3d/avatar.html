<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SpeakFlow Avatar V2</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;}
  body::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 28%,rgba(255,255,255,.98) 0%,rgba(239,241,250,.94) 48%,rgba(218,222,238,.72) 100%);pointer-events:none;}
  canvas{position:relative;z-index:1;display:block;width:100%;height:100%;}
  #s{position:absolute;z-index:2;top:10px;left:12px;font:11px/1.4 -apple-system,system-ui,sans-serif;color:rgba(90,95,118,.65);pointer-events:none;letter-spacing:.02em;}
</style>
</head>
<body>
<div id="s">Loading Avatar V2…</div>
<script>
  window.addEventListener('error', (event) => {
    const message = event?.error?.message || event?.message || 'runtime error';
    document.getElementById('s').textContent = `Avatar runtime error: ${message}`;
  });
  window.addEventListener('unhandledrejection', (event) => {
    document.getElementById('s').textContent = `Avatar runtime error: ${event.reason || 'module failed'}`;
  });
</script>
<script type="module" src="./avatar-v2-runtime.js"></script>
</body>
</html>
