name: speakflow
description: "AI English Speaking Practice App with Virtual Tutor"
publish_to: 'none'
version: 1.0.7+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Theming
  cupertino_icons: ^1.0.8
  dynamic_color: ^1.8.1
  shimmer: ^2.0.0
  flutter_animate: ^4.5.2

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # HTTP
  http: ^1.4.0

  # Audio
  record: ^5.2.1
  just_audio: ^0.9.43

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  equatable: ^2.0.7

  # Platform
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

  # File picking (profile import, etc.)
  file_picker: ^8.0.0+1

  # 3D avatar (mobile/desktop webview; web uses HtmlElementView)
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Phase 4 — in-memory SQLite for repository tests.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/animations/
    - assets/images/
    - assets/3d/
    # Flutter's asset bundler includes directory entries directly; declare
    # Avatar V2's nested model/worklet folders explicitly so Web and WebView
    # resolve the GLB and HeadAudio files at runtime.
    - assets/3d/avatar-v2/
    - assets/3d/vendor/
    - assets/3d/vendor/headaudio/
    - assets/3d/vendor/talkinghead/
    - assets/3d/vendor/three/examples/jsm/controls/
    - assets/3d/vendor/three/examples/jsm/curves/
    - assets/3d/vendor/three/examples/jsm/environments/
    - assets/3d/vendor/three/examples/jsm/libs/
    - assets/3d/vendor/three/examples/jsm/loaders/
    - assets/3d/vendor/three/examples/jsm/utils/
    - assets/simulation/
    # Phase 3 — Live2D model folder. Empty in this commit; when a model
    # ships (outsourced Live2D art), drop the .model3.json + .moc3 +
    # textures + motions + expressions under assets/live2d/tutor/ and the
    # loader (lib/features/avatar/data/live2d_loader.dart) will pick it up
    # automatically. The directory entry must exist for Flutter to include
    # any sub-paths at build time.
    - assets/live2d/
